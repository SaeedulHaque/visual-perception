# Offline replay of the recorded simulation runs (design section 7): every
# frame of each bag, exported to MOT17 layout by docker/sim_run.sh and
# scripts/make_sim_gt.py, through the Phase 2 sequence runner. Same model,
# threshold, ROI and filter as the perception node; clean frames only.
run_name: sim_replay
data_root: data/raw/sim/sequences
sequences: [static_r1, static_r2, static_r3, scripted_r1, scripted_r2, scripted_r3]
output_root: results/sim

model:
  weights: models/yolo26n.pt
  imgsz: [416]
  conf: 0.001
  max_det: 300
  device: cpu

decision:
  target_class: person
  conf_threshold: 0.5

# Setting adopted in Phase 2 (results/sequence_main/adopted_filter.json).
filter: {n_on: 2, k_window: 3, m_off: 3}

# Sim ROI (sim_geometry.SIM_ROI): design x band and height, no vertical band.
roi: {x_min: 0.30, x_max: 0.70, y_min: 0.0, y_max: 1.0, min_height: 0.25}

conditions:
  - {name: clean, kind: clean}

noise_seed: 1234
warmup: 10
