# Usage (from the repository root):
#   docker compose -f docker/compose.yaml build
#   docker compose -f docker/compose.yaml run --rm sim <command>
services:
  sim:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: rvp-sim:jazzy
    # Run as the host user so files written to the mounted repository are
    # not owned by root.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-991}"
    devices:
      - /dev/dri:/dev/dri
    shm_size: 1gb
    volumes:
      - ..:/work
      # X display for the optional Gazebo GUI (RVP_GUI=1, teleop only).
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    environment:
      - RVP_SOFTWARE_RENDERING=${RVP_SOFTWARE_RENDERING:-0}
      - RVP_GUI=${RVP_GUI:-0}
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
    stdin_open: true
    tty: true
